services:
  db:
    image: postgres:16-alpine
    container_name: gocomet-nova-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trade_docs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trade_docs"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: gocomet-nova-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/trade_docs
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EXTRACTOR_MODEL: ${EXTRACTOR_MODEL:-gemini-3.8-flash}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-gemini-3.1-pro-preview}
      LITE_MODEL: ${LITE_MODEL:-gemini-2.5-flash-lite}
      UPLOAD_DIR: uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: gocomet-nova-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres_data:
  uploads_data:
